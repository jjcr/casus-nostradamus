[www]
; Niet aanpassen tenzij je het geheugen op de Pi opnieuw hebt nagemeten:
; vaste pool van 10 workers (elk ~30 MB, past in de ~700 MB van de php-container).
; Geen forks tijdens de piek, voorspelbaar geheugengebruik.
pm = static
pm.max_children = 10
pm.max_requests = 0

; Environment-variabelen (DB_PATH e.d.) doorgeven aan workers; fouten naar docker logs.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
