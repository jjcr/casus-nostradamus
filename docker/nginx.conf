# nginx voor 't Klosterke. Drie soorten verkeer:
#   GET /game                      -> bestand uit /runtime/game.json (geen PHP, dit is het drukke deel)
#   /health, /order/new, /order/status -> PHP-FPM (public/index.php)
#   alles anders                   -> statische bestanden uit public/ (welkom.html, order.html, scores.html, status.html, bar.html)
# Plus een tweede server op poort 8081 (alleen binnen Docker) voor de ngrok-tunnel, zie onderaan.

user nginx;

# Niet aanpassen tenzij de Pi een ander aantal cores heeft: 1 worker per core.
worker_processes 4;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    # Niet aanpassen tenzij nginx "worker_connections are not enough" meldt.
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    # Niet aanpassen tenzij je weet wat je doet: telefoons hergebruiken verbindingen bij het pollen.
    # Dat scheelt veel CPU op de Pi.
    keepalive_timeout 65;
    keepalive_requests 10000;

    client_max_body_size 16k;

    # Doorverwijzingen (/ -> /welkom.html) relatief laten: nginx weet niet onder welke poort Docker hem publiceert
    # (8080, 80 of een ngrok-adres) en zou anders een verkeerd adres terugsturen.
    absolute_redirect off;

    # Geen access log: dat scheelt schrijven op de SD-kaart. Bestellingen staan in SQLite.
    access_log off;

    # PHP-FPM wordt per verzoek opnieuw opgezocht (Docker-DNS), niet eenmalig bij het starten van nginx.
    # Anders houdt nginx een oud IP-adres vast als de php-container opnieuw start (bijv. na een reboot)
    # en geven /health en /order/new 502 tot nginx zelf herstart. Niet aanpassen tenzij je weet wat je doet.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        root /var/www/html/public;

        location = / {
            return 302 /welkom.html;
        }

        # Hete read-path: een statisch bestand, 1x per seconde geschreven door game-writer.
        # POST /game is niet gebouwd (zie docs/implementatie.md).
        location = /game {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 501 '{"error":"not_implemented"}';
            }
            default_type application/json;
            # Niet aanpassen tenzij de spelstand vaker/minder vaak moet verversen dan elke seconde.
            add_header Cache-Control "max-age=1";
            alias /runtime/game.json;
        }

        # Schrijf-pad, health en barroutes: naar PHP-FPM. De router staat in public/index.php.
        location ~ ^/(health|order/new|order/status|bar/(batch|ready|pause))$ {
            include fastcgi_params;
            # Bewust GEEN keepalive naar PHP-FPM: een open verbinding houdt ook een FPM-worker vast (ook als hij niets doet).
            # Met 10 workers en meer open verbindingen blijven aanvragen tot 60 s hangen. Niet aanpassen.
            set $php_upstream php:9000;
            fastcgi_pass $php_upstream;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        }

        # status.html, scores.html
        location / {
            try_files $uri =404;
        }
    }

    # Alleen voor de ngrok-tunnel (docker compose --profile tunnel): bezoekers van buiten het netwerk zien
    # alleen wat een bezoeker nodig heeft. bar.html, /bar/* en status.html zijn hier 404: die hebben geen inlog.
    server {
        listen 8081;
        root /var/www/html/public;

        location = / { return 302 /welkom.html; }
        location = /welkom.html { }
        location = /bezoeker.js { }
        location = /order.html { }
        location = /scores.html { }

        location = /game {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 501 '{"error":"not_implemented"}';
            }
            default_type application/json;
            add_header Cache-Control "max-age=1";
            alias /runtime/game.json;
        }

        location = /order/new {
            include fastcgi_params;
            set $php_upstream php:9000;
            fastcgi_pass $php_upstream;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        }

        location / { return 404; }
    }
}
