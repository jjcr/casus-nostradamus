date.timezone = Europe/Amsterdam
expose_php = Off
display_errors = Off
log_errors = On

; Niet aanpassen tenzij je weet wat je doet: validate_timestamps=0 betekent dat PHP-bestanden
; nooit opnieuw worden gelezen. Code wijzigen = image opnieuw bouwen (./bin/klosterke start).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 32
opcache.max_accelerated_files = 200
